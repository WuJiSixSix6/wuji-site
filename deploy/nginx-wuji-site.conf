server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wujisixsix6.cn www.wujisixsix6.cn;

    charset utf-8;
    root /var/www/wuji-site;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # Immutable cache for Astro hashed assets (JS, CSS, KaTeX fonts)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 30d;
        try_files /favicon.svg =204;
    }

    # Always revalidate JSON index, RSS, and HTML pages
    location ~* \.(?:html|json|xml)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Zero-redirect clean static routing (serves /path and /path/ directly with 200 OK)
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
